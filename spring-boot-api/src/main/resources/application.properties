spring.application.name=distributed-computing-control-plane
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:${SERVER_PORT:10000}}
cluster.rmi.nodes=${RMI_NODES:1@localhost:5001,2@localhost:5002,3@localhost:5003,4@localhost:5004}

# Persistent dashboard/history database. Runtime node state is still queried from RMI.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:distributed_computing}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:distributed_app}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

coordinator.rmi.host=${COORDINATOR_RMI_HOST:localhost}
coordinator.rmi.port=${COORDINATOR_RMI_PORT:1099}

# Experiment 7 runs a genuine Apache Spark local job by default. The master
# and partition count can be overridden for laboratory demonstrations.
experiment7.spark.master=${EXPERIMENT7_SPARK_MASTER:local[1]}
experiment7.spark.partitions=${EXPERIMENT7_SPARK_PARTITIONS:1}
experiment7.history-limit=${EXPERIMENT7_HISTORY_LIMIT:500}

# Experiment 9 uses the local Dockerized MPJ Express runtime so four true MPI ranks can run on Windows.
experiment9.launcher=${EXPERIMENT9_LAUNCHER:docker}
experiment9.compose-file=${EXPERIMENT9_COMPOSE_FILE:experiment9/compose.yaml}
experiment9.project-root=${EXPERIMENT9_PROJECT_ROOT:../java-system/shared}
experiment9.ranks=${EXPERIMENT9_RANKS:4}
experiment9.timeout-seconds=${EXPERIMENT9_TIMEOUT_SECONDS:120}

# Experiment 10 reuses the same Dockerized MPJ Express image with its own source/Compose file.
experiment10.launcher=${EXPERIMENT10_LAUNCHER:docker}
experiment10.compose-file=${EXPERIMENT10_COMPOSE_FILE:experiment10/compose.yaml}
experiment10.project-root=${EXPERIMENT10_PROJECT_ROOT:../java-system/shared}
experiment10.ranks=${EXPERIMENT10_RANKS:4}
experiment10.default-matrix-size=${EXPERIMENT10_DEFAULT_MATRIX_SIZE:200}
experiment10.timeout-seconds=${EXPERIMENT10_TIMEOUT_SECONDS:180}

# Public deployment state-changing operations require this server-side token.
demo-control.required=${DEMO_CONTROL_ENFORCE:false}
demo-control.token=${DEMO_CONTROL_TOKEN:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

