spring.application.name=distributed-computing-control-plane
server.port=${SERVER_PORT:8080}
cluster.rmi.nodes=${RMI_NODES:1@localhost:5001,2@localhost:5002,3@localhost:5003,4@localhost:5004}

# Persistent dashboard/history database. Runtime node state is still queried from RMI.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:distributed_computing}}
spring.datasource.username=${POSTGRES_USER:distributed_app}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

coordinator.rmi.host=${COORDINATOR_RMI_HOST:localhost}
coordinator.rmi.port=${COORDINATOR_RMI_PORT:1099}

# Experiment 7 runs a genuine Apache Spark local job by default. The master
# and partition count can be overridden for laboratory demonstrations.
experiment7.spark.master=${EXPERIMENT7_SPARK_MASTER:local[2]}
experiment7.spark.partitions=${EXPERIMENT7_SPARK_PARTITIONS:2}
experiment7.history-limit=${EXPERIMENT7_HISTORY_LIMIT:500}
