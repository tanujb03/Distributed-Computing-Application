services:
  mpi:
    build:
      context: ../experiment9
      dockerfile: Dockerfile
    image: distributed-computing-mpj:0.44
    environment:
      EXPERIMENT10_RANKS: ${EXPERIMENT10_RANKS:-4}
      EXPERIMENT10_MATRIX_SIZE: ${EXPERIMENT10_MATRIX_SIZE:-200}
      MPJ_JAVA_TOOL_OPTIONS: ${MPJ_JAVA_TOOL_OPTIONS:-}
    volumes:
      - ./src:/experiment10/src:ro
      - ./run-mpi.sh:/experiment10/run-mpi.sh:ro
    entrypoint: ["/bin/sh", "/experiment10/run-mpi.sh"]
